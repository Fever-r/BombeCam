name: Release

# Pushing a tag like v1.0.0 builds the downloads from that tag, pushes the
# Docker image ghcr.io/<owner>/bombecam-gateway:1.0.0 made from the Linux
# downloads, and creates a draft release with the downloads. Check the draft,
# then press Publish on GitHub. Publishing points the image's major-version
# tag (1) and latest at the release's image; deploy/docker-compose.yml runs
# the major-version tag.
on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: Build the downloads
        env:
          # The Osaio server key and app ID built into the downloads (obscured):
          # the repository's OSAIO_SERVER_KEY and OSAIO_APP_ID Actions secrets.
          # tools/release stops without them.
          BOMBECAM_SERVER_KEY: ${{ secrets.OSAIO_SERVER_KEY }}
          BOMBECAM_APP_ID: ${{ secrets.OSAIO_APP_ID }}
        run: go run ./tools/release -version "${GITHUB_REF_NAME#v}" -out dist -notes release-notes.md
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Check extraction and the packaged Docker images
        run: |
          python3 tests/deploy/gateway_extract_test.py
          for platform in linux/amd64 linux/arm64 linux/arm/v7 linux/arm/v6; do
            python3 tests/deploy/gateway_image_test.py --downloads dist --platform "$platform"
          done
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push the Docker image
        # The image gets the gateway program from the Linux downloads above
        # (checksum-checked), so it runs exactly what the downloads do; the
        # image build never sees the secrets.
        run: |
          ver="${GITHUB_REF_NAME#v}"
          docker buildx build --push \
            --platform linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6 \
            --file deploy/Dockerfile.gateway \
            --build-arg GATEWAY_FROM=release \
            --build-context downloads=dist \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.version="$ver" \
            --tag "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bombecam-gateway:$ver" \
            .
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --draft --verify-tag
          --title "BombeCam ${GITHUB_REF_NAME#v}"
          --notes-file release-notes.md

  # Publishing the release makes its image the one Docker setups pull. Not
  # for pre-releases (1.1.0-beta.1).
  docker-tags:
    if: github.event_name == 'release' && !github.event.release.prerelease && !contains(github.event.release.tag_name, '-')
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Point the major-version tag and latest at this release's image
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ver="${TAG#v}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bombecam-gateway"
          docker buildx imagetools create --tag "$image:${ver%%.*}" --tag "$image:latest" "$image:$ver"
