# ==============================================================================
# Mosquitto Broker Configuration for BombeCam
# Supporting Port 1883 (Internal Bus) and Port 8883 (MQTTS TLS Listener)
# ==============================================================================

per_listener_settings false

# ------------------------------------------------------------------------------
# 1. Unencrypted Internal Listener (Port 1883)
# ------------------------------------------------------------------------------
listener 1883 127.0.0.1
allow_anonymous true

# ------------------------------------------------------------------------------
# 2. MQTTS TLS Listener (Port 8883) for AWS IoT & Camera Control Plane
# ------------------------------------------------------------------------------
listener 8883 0.0.0.0
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

# CERT_OPTIONAL: Allow clients without TLS client certificates to connect
require_certificate false
tls_version tlsv1.2
allow_anonymous true

# ------------------------------------------------------------------------------
# 3. Persistence & Logging
# ------------------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
